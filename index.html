<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trazabilidad de Productos</title>
<meta name="theme-color" content="#1a1a1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Trazabilidad"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.2/tesseract.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#eeede9;--text:#1a1a1a;--text2:#6b6b6b;--text3:#bbb;--border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.20);--radius:8px;--radius-lg:12px;--green:#1D9E75;--green-bg:#E1F5EE;--blue:#378ADD;--blue-bg:#E6F1FB;--amber:#BA7517;--amber-bg:#FAEEDA;--red:#E24B4A;--red-bg:#FCEBEB}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1b;--bg2:#262624;--bg3:#2e2e2c;--text:#f0efec;--text2:#999;--text3:#555;--border:rgba(255,255,255,.10);--border2:rgba(255,255,255,.20)}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
header{background:var(--bg);border-bottom:.5px solid var(--border);padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;gap:10px}
.logo{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{color:var(--blue);font-size:20px}
.logo .sub{font-weight:400;font-size:12px;color:var(--text2)}
select,input,textarea{font-family:inherit}
.emp-select{padding:6px 10px;font-size:13px;border:.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);max-width:160px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;flex-shrink:0}
.status-dot.online{background:var(--green)}.status-dot.saving{background:var(--amber);animation:pulse .8s infinite}.status-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:6px;max-width:720px;margin:1rem auto 0;padding:0 1rem}
.tab{flex:1;text-align:center;padding:9px 0;font-size:13.5px;font-weight:600;border:.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text2);cursor:pointer}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.main{max-width:720px;margin:0 auto;padding:1rem}
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:.85rem}
.btn{padding:8px 14px;font-size:13px;font-weight:500;border:.5px solid var(--border2);border-radius:var(--radius);background:transparent;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn-primary:hover{opacity:.85;background:var(--text)}
.btn-primary:disabled{background:var(--border2);color:var(--text2);border-color:var(--border2)}
.btn-danger{color:var(--red);border-color:rgba(226,75,74,.3)}.btn-danger:hover{background:var(--red-bg)}
.btn-block{width:100%;justify-content:center}
.field{margin-bottom:.6rem}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:3px}
.field input,.field select{width:100%;padding:8px 10px;font-size:14px;border:.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem;gap:8px}
h1{font-size:16px;font-weight:600}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text2);font-size:13px}
.empty i{font-size:30px;display:block;margin-bottom:8px;color:var(--text3)}
.foto-preview-wrap{text-align:center;margin:.6rem 0}
.foto-preview{max-width:100%;max-height:260px;border-radius:var(--radius);border:.5px solid var(--border)}
.ocr-status{font-size:12.5px;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:7px;margin:.5rem 0}
.ocr-toggle{font-size:11px;color:var(--text2);cursor:pointer;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.ocr-raw{font-size:11px;color:var(--text2);background:var(--bg2);border:.5px solid var(--border);border-radius:6px;padding:6px 8px;margin-top:5px;white-space:pre-wrap;word-break:break-word;display:none}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--text2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:9px 13px;border-radius:var(--radius);font-size:12.5px;margin-bottom:.75rem;display:flex;align-items:center;gap:7px}
.alert-info{background:var(--blue-bg);color:#185FA5}
.alert-err{background:var(--red-bg);color:#A32D2D}
.alert-ok{background:var(--green-bg);color:#0F6E56}
.text-muted{color:var(--text2);font-size:12px}
.link-muted{color:var(--text2);font-size:12px;text-decoration:underline;cursor:pointer}
.hidden{display:none!important}
.gal-filtros{display:flex;gap:.6rem;align-items:flex-end;margin-bottom:.85rem;flex-wrap:wrap}
.gal-filtros .field{margin-bottom:0;flex:1;min-width:140px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.gal-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;position:relative}
.gal-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--bg3);cursor:pointer;display:block}
.gal-thumb-empty{width:100%;aspect-ratio:1/1;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:26px}
.gal-body{padding:.55rem .6rem .65rem}
.gal-prod{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal-sub{font-size:11.5px;color:var(--text2);margin-top:2px}
.gal-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;border:none}
.back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);cursor:pointer;margin-bottom:.6rem}
.back:hover{color:var(--text)}
.prod-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:.5px solid var(--border2);border-radius:var(--radius-lg);background:var(--bg);cursor:pointer;font-family:inherit;color:var(--text)}
.prod-btn:hover{background:var(--bg2)}
.prod-btn-row{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.prod-btn-nombre{font-size:14px;font-weight:600}
.prod-btn-sub{font-size:12px;color:var(--text2);margin-top:2px}
.prod-btn-icon{font-size:19px;color:var(--text3);flex-shrink:0}
.prod-btn-manual{border-style:dashed;color:var(--text2)}
.prod-btn-done{border-color:var(--green);background:var(--green-bg)}
.prod-btn-thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:1000;padding:1.5rem}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:4px}
.lightbox .close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="logo"><i class="ti ti-barcode"></i> Trazabilidad <span class="sub">de Productos</span></div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="status-dot" id="statusDot"></span>
    <select class="emp-select" id="empSelect" onchange="cambiarEmpresa(this.value)"></select>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tabCargar" onclick="irVista('cargar')"><i class="ti ti-camera"></i> Cargar foto</div>
  <div class="tab" id="tabGaleria" onclick="irVista('galeria')"><i class="ti ti-photo"></i> Galería</div>
</div>

<div class="main" id="main">

  <!-- ===== VISTA CARGAR ===== -->
  <div id="vistaCargar">
    <div class="card">
      <div class="field"><label>Fecha</label><input id="ft-fecha" type="date" onchange="onCambioFechaForm()"/></div>
    </div>

    <div id="ft-grid-wrap">
      <div class="toolbar"><h1>Producción de hoy</h1></div>
      <div id="ft-producto-botones"></div>
      <div class="text-muted hidden" id="ft-sinplan-msg" style="margin:-.3rem 0 .6rem">No hay nada planificado para esta fecha en esta empresa.</div>
    </div>

    <div id="ft-detalle" class="hidden">
      <div class="back" onclick="volverAGrid()"><i class="ti ti-arrow-left"></i> Volver a productos</div>
      <div class="card">
        <div class="field hidden" id="ft-manual-wrap"><label>Producto (manual)</label><input id="ft-producto-manual" placeholder="Nombre del producto" oninput="onManualChange()"/></div>
        <div id="ft-producto-elegido-head" style="font-size:16px;font-weight:700;margin-bottom:.7rem"></div>

        <div class="row2">
          <div class="field"><label>Cantidad</label><input id="ft-cantidad" type="number" step="any" placeholder="300"/></div>
          <div class="field"><label>Unidad</label><input id="ft-unidad" list="dl-unidades" placeholder="docenas, kg..."/><datalist id="dl-unidades">
            <option value="docenas"></option><option value="unidades"></option><option value="kg"></option><option value="cajas"></option><option value="litros"></option>
          </datalist></div>
        </div>
        <div class="text-muted hidden" id="ft-autoplan-msg" style="margin:-.3rem 0 .6rem">Cantidad tomada del Plan de Producción — la podés corregir si lo real fue distinto.</div>

        <div id="ft-sinFoto">
          <input type="file" accept="image/*" capture="environment" id="ft-file" class="hidden" onchange="onFotoElegida(event)"/>
          <button class="btn btn-block" onclick="document.getElementById('ft-file').click()"><i class="ti ti-camera"></i> Sacar foto del producto (fechada)</button>
        </div>

        <div id="ft-conFoto" class="hidden">
          <div class="foto-preview-wrap"><img id="ft-preview" class="foto-preview"/></div>
          <div class="ocr-status" id="ft-ocrStatus"></div>
          <div class="field"><label>Fecha del producto (la que se ve en la foto)</label><input id="ft-fechadet" type="date"/></div>
          <div class="ocr-toggle" id="ft-ocrToggle" onclick="toggleOcrRaw()">ver texto leído por la cámara</div>
          <div class="ocr-raw" id="ft-ocrRaw"></div>
          <button class="btn btn-block" style="margin-top:.5rem" onclick="document.getElementById('ft-file').click()"><i class="ti ti-camera-plus"></i> Volver a sacar la foto</button>
        </div>

        <button class="btn btn-primary btn-block" style="margin-top:.7rem" id="ft-guardarBtn" onclick="guardarFoto()" disabled><i class="ti ti-device-floppy"></i> Guardar</button>
      </div>
    </div>

    <div id="ft-ok"></div>
  </div>

  <!-- ===== VISTA GALERÍA ===== -->
  <div id="vistaGaleria" class="hidden">
    <div class="gal-filtros">
      <div class="field"><label>Fecha</label><input id="gl-fecha" type="date" onchange="cargarGaleria()"/></div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);white-space:nowrap">
        <input type="checkbox" id="gl-todas" onchange="cargarGaleria()" style="width:auto"/> ver todas las fechas
      </label>
    </div>
    <div id="galeriaCont"></div>
  </div>

</div>

<div class="lightbox" id="lightbox" onclick="cerrarLightbox()">
  <div class="close" onclick="cerrarLightbox()"><i class="ti ti-x"></i></div>
  <img id="lightboxImg"/>
</div>

<script>
const SB='https://ugmjfvgjumpnvbfskcgl.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnbWpmdmdqdW1wbnZiZnNrY2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjU4OTIsImV4cCI6MjA5NDEwMTg5Mn0.fmf7Isp5rDi10mq0VjahWRCgl6J4mD8-ib89DKWtPLs';
const H={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};
const BUCKET='trazabilidad';
const get=async(t,f='')=>{const r=await fetch(`${SB}/rest/v1/${t}?${f}`,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json()};
const ins=async(t,d)=>{const r=await fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json()};
const del=async(t,id)=>{const r=await fetch(`${SB}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:H});if(!r.ok)throw new Error(await r.text())};

async function subirFoto(blob,path){
  const r=await fetch(`${SB}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:SK,'Authorization':'Bearer '+SK,'Content-Type':'image/jpeg'},body:blob});
  if(!r.ok)throw new Error(await r.text());
  return `${SB}/storage/v1/object/public/${BUCKET}/${path}`;
}
async function borrarFoto(path){
  if(!path)return;
  try{await fetch(`${SB}/storage/v1/object/${BUCKET}/${path}`,{method:'DELETE',headers:{apikey:SK,'Authorization':'Bearer '+SK}});}catch(e){}
}

function ss(s){
  const d=document.getElementById('statusDot');
  d.className='status-dot'+(s?' '+s:'');
}

function normTxt(s){
  return String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
const wk=d=>{const dt=new Date(d);dt.setHours(0,0,0,0);dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return dt.toISOString().slice(0,10)};
function diaIndex(fecha){return (new Date(fecha+'T00:00:00').getDay()+6)%7}

// ---------- estado ----------
let st={empresas:[],empresaId:null,planOpciones:[],fotoBlobPendiente:null,ocrWorker:null,galeria:[],fotosHoy:[]};

async function init(){
  ss('saving');
  try{st.empresas=await get('empresas','order=nombre.asc')}catch(e){st.empresas=[]}
  const sel=document.getElementById('empSelect');
  sel.innerHTML=st.empresas.map(e=>`<option value="${e.id}">${e.nombre}</option>`).join('');
  if(st.empresas.length)st.empresaId=st.empresas[0].id;
  document.getElementById('ft-fecha').value=hoyLocal();
  document.getElementById('gl-fecha').value=hoyLocal();
  await onCambioFechaForm();
  ss('online');
}

function hoyLocal(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function cambiarEmpresa(id){
  st.empresaId=id;
  onCambioFechaForm();
  if(!document.getElementById('vistaGaleria').classList.contains('hidden'))cargarGaleria();
}

function irVista(v){
  document.getElementById('vistaCargar').classList.toggle('hidden',v!=='cargar');
  document.getElementById('vistaGaleria').classList.toggle('hidden',v!=='galeria');
  document.getElementById('tabCargar').classList.toggle('active',v==='cargar');
  document.getElementById('tabGaleria').classList.toggle('active',v==='galeria');
  if(v==='galeria')cargarGaleria();
  window.scrollTo(0,0);
}

// ---------- plan del día (producto + cantidad) ----------
async function cargarPlanFecha(fecha){
  const semana=wk(new Date(fecha+'T00:00:00'));
  const di=diaIndex(fecha);
  let filas=[];
  try{
    const d=await get('planes',`semana=eq.${semana}&select=filas`);
    filas=d.length?(d[0].filas||[]):[];
  }catch(e){filas=[]}
  return filas.filter(r=>r.empresa_id===st.empresaId&&r.days&&r.days[di]>0)
    .map(r=>({producto:r.producto,area:r.area,cantidad:r.days[di],unidad:r.unidad||''}))
    .sort((a,b)=>a.producto.localeCompare(b.producto,'es'));
}

async function onCambioFechaForm(){
  const fecha=document.getElementById('ft-fecha').value;
  const botonesEl=document.getElementById('ft-producto-botones');
  const sinPlanMsg=document.getElementById('ft-sinplan-msg');
  volverAGrid();
  document.getElementById('ft-ok').innerHTML='';
  st.productoElegido=null;st.areaElegida=null;
  sinPlanMsg.classList.add('hidden');
  if(!fecha||!st.empresaId){botonesEl.innerHTML='<div class="text-muted">Elegí una fecha...</div>';return}
  botonesEl.innerHTML='<div class="text-muted">Buscando el plan...</div>';
  const[plan]=await Promise.all([cargarPlanFecha(fecha),cargarFotosFecha(fecha)]);
  st.planOpciones=plan;
  renderBotonesProducto();
}

// v3-addendum: "cuando a un producto le sacas la foto que ponga el botón en verde" -- fotosHoy
// trae lo ya guardado hoy (empresa+fecha actuales) en trazabilidad_fotos, para que el botón de
// cada producto planificado muestre si ya tiene foto (verde + miniatura) o todavía no (gris +
// cámara). Se recarga al cambiar fecha/empresa y también justo después de guardar una foto.
async function cargarFotosFecha(fecha){
  if(!st.empresaId||!fecha){st.fotosHoy=[];return}
  try{
    st.fotosHoy=await get('trazabilidad_fotos',`empresa_id=eq.${st.empresaId}&fecha=eq.${fecha}&order=created_at.desc`);
  }catch(e){st.fotosHoy=[]}
}
function buscarFotoProducto(nombre){
  const n=normTxt(nombre);
  return st.fotosHoy.find(f=>normTxt(f.producto)===n)||null;
}

function renderBotonesProducto(){
  const botonesEl=document.getElementById('ft-producto-botones');
  const sinPlanMsg=document.getElementById('ft-sinplan-msg');
  if(!st.planOpciones.length){
    botonesEl.innerHTML=productoBotonManualHtml();
    sinPlanMsg.classList.remove('hidden');
  }else{
    botonesEl.innerHTML=st.planOpciones.map((o,i)=>productoBotonHtml(i,o)).join('')+productoBotonManualHtml();
    sinPlanMsg.classList.add('hidden');
  }
}

function productoBotonHtml(i,o){
  const foto=buscarFotoProducto(o.producto);
  const thumb=foto?`<img class="prod-btn-thumb" src="${foto.foto_url||''}"/>`:'';
  return `<button type="button" class="prod-btn${foto?' prod-btn-done':''}" onclick="elegirProducto(${i})">
    <div class="prod-btn-row">
      ${thumb}
      <div>
        <div class="prod-btn-nombre">${esc(o.producto)}</div>
        <div class="prod-btn-sub">${o.area?esc(o.area)+' · ':''}${o.cantidad.toLocaleString('es-AR')}${o.unidad?' '+esc(o.unidad):''}</div>
      </div>
    </div>
    <i class="ti ${foto?'ti-circle-check':'ti-camera'} prod-btn-icon" ${foto?'style="color:var(--green)"':''}></i>
  </button>`;
}
function productoBotonManualHtml(){
  return `<button type="button" class="prod-btn prod-btn-manual" onclick="elegirProducto('manual')">
    <div class="prod-btn-nombre">Otro producto (no estaba planificado)</div>
    <i class="ti ti-plus prod-btn-icon"></i>
  </button>`;
}

function volverAGrid(){
  document.getElementById('ft-detalle').classList.add('hidden');
  document.getElementById('ft-grid-wrap').classList.remove('hidden');
}

function elegirProducto(v){
  document.getElementById('ft-grid-wrap').classList.add('hidden');
  document.getElementById('ft-detalle').classList.remove('hidden');
  const manualWrap=document.getElementById('ft-manual-wrap');
  const head=document.getElementById('ft-producto-elegido-head');
  const autoMsg=document.getElementById('ft-autoplan-msg');
  resetFotoParcial();
  if(v==='manual'){
    manualWrap.classList.remove('hidden');
    head.textContent='';
    document.getElementById('ft-producto-manual').value='';
    document.getElementById('ft-cantidad').value='';
    document.getElementById('ft-unidad').value='';
    autoMsg.classList.add('hidden');
    st.productoElegido=null;st.areaElegida=null;
    document.getElementById('ft-producto-manual').focus();
    window.scrollTo(0,0);
    return;
  }
  manualWrap.classList.add('hidden');
  const o=st.planOpciones[v];
  if(!o)return;
  head.textContent=o.producto+(o.area?' ('+o.area+')':'');
  document.getElementById('ft-cantidad').value=o.cantidad;
  document.getElementById('ft-unidad').value=o.unidad;
  autoMsg.classList.remove('hidden');
  st.productoElegido=o.producto;st.areaElegida=o.area||null;
  window.scrollTo(0,0);
}

function onManualChange(){
  const nombre=document.getElementById('ft-producto-manual').value.trim();
  st.productoElegido=nombre||null;st.areaElegida=null;
}

function resetFotoParcial(){
  document.getElementById('ft-sinFoto').classList.remove('hidden');
  document.getElementById('ft-conFoto').classList.add('hidden');
  document.getElementById('ft-guardarBtn').disabled=true;
  st.fotoBlobPendiente=null;
  document.getElementById('ft-ok').innerHTML='';
}

function forzarManual(){
  elegirProducto('manual');
}

// ---------- foto + OCR ----------
async function comprimirImagen(file,maxDim,calidad){
  maxDim=maxDim||1600;calidad=calidad||0.82;
  let bitmap;
  try{bitmap=await createImageBitmap(file)}
  catch(e){
    bitmap=await new Promise((res,rej)=>{
      const img=new Image();
      img.onload=()=>res(img);
      img.onerror=rej;
      img.src=URL.createObjectURL(file);
    });
  }
  let w=bitmap.width||bitmap.naturalWidth,h=bitmap.height||bitmap.naturalHeight;
  if(w>maxDim||h>maxDim){
    const r=Math.min(maxDim/w,maxDim/h);
    w=Math.round(w*r);h=Math.round(h*r);
  }
  const canvas=document.createElement('canvas');
  canvas.width=w;canvas.height=h;
  canvas.getContext('2d').drawImage(bitmap,0,0,w,h);
  return new Promise(res=>canvas.toBlob(b=>res(b),'image/jpeg',calidad));
}

async function onFotoElegida(ev){
  const file=ev.target.files[0];
  if(!file)return;
  document.getElementById('ft-sinFoto').classList.add('hidden');
  document.getElementById('ft-conFoto').classList.remove('hidden');
  document.getElementById('ft-fechadet').value='';
  document.getElementById('ft-ocrRaw').textContent='';
  document.getElementById('ft-ocrToggle').style.display='none';
  document.getElementById('ft-ocrRaw').style.display='none';
  document.getElementById('ft-guardarBtn').disabled=true;

  const ocrStatus=document.getElementById('ft-ocrStatus');
  ocrStatus.innerHTML=`<span class="spinner"></span> Procesando foto...`;

  try{
    const blob=await comprimirImagen(file);
    st.fotoBlobPendiente=blob;
    document.getElementById('ft-preview').src=URL.createObjectURL(blob);

    ocrStatus.innerHTML=`<span class="spinner"></span> Leyendo la fecha...`;
    const texto=await leerEtiqueta(blob);
    const venc=parsearFecha(texto);
    document.getElementById('ft-fechadet').value=venc;
    document.getElementById('ft-ocrRaw').textContent=texto.trim()||'(no se detectó texto)';
    document.getElementById('ft-ocrToggle').style.display='inline-flex';
    ocrStatus.innerHTML=venc
      ?`<i class="ti ti-check" style="color:var(--green)"></i> Fecha detectada — revisala antes de guardar.`
      :`<i class="ti ti-alert-triangle" style="color:var(--amber)"></i> No se pudo leer la fecha sola. Completala a mano.`;
  }catch(e){
    ocrStatus.innerHTML=`<i class="ti ti-alert-triangle" style="color:var(--amber)"></i> No se pudo leer la foto automáticamente. Completá la fecha a mano.`;
  }
  document.getElementById('ft-guardarBtn').disabled=false;
}

async function leerEtiqueta(blob){
  if(!st.ocrWorker){st.ocrWorker=await Tesseract.createWorker('spa')}
  const{data}=await st.ocrWorker.recognize(blob);
  return data.text||'';
}

function toggleOcrRaw(){
  const el=document.getElementById('ft-ocrRaw');
  el.style.display=el.style.display==='block'?'none':'block';
}

function fechaISO(d,m,y){
  d=parseInt(d,10);m=parseInt(m,10);y=parseInt(y,10);
  if(y<100)y+=(y<50?2000:1900);
  if(!(m>=1&&m<=12)||!(d>=1&&d<=31))return '';
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function parsearFecha(textoOriginal){
  const T=(textoOriginal||'').toUpperCase();
  let venc='';

  let m=T.match(/F\.?\s*V\.?\s*[:\.]?\s*(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(!m)m=T.match(/VENC[A-ZÁÉÍÓÚ]*\.?\s*[:\.]?\s*(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m)venc=fechaISO(m[1],m[2],m[3]);

  if(!venc){
    const MESES={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,SET:9,OCT:10,NOV:11,DIC:12,JAN:1,APR:4,AUG:8,DEC:12};
    const m2=T.match(/(\d{1,2})\s*([A-Z]{3})\s*(\d{4})/);
    if(m2&&MESES[m2[2]])venc=fechaISO(m2[1],MESES[m2[2]],m2[3]);
  }

  if(!venc){
    const m3=T.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if(m3)venc=fechaISO(m3[1],m3[2],m3[3]);
  }
  return venc;
}

async function guardarFoto(){
  const producto=(st.productoElegido||'').trim();
  if(!producto){alert('Falta elegir o escribir el producto.');return}
  if(!st.empresaId){alert('No hay empresa seleccionada.');return}
  const fecha=document.getElementById('ft-fecha').value||hoyLocal();
  const cantidad=document.getElementById('ft-cantidad').value;
  const unidad=document.getElementById('ft-unidad').value.trim();
  const fechaDet=document.getElementById('ft-fechadet').value||null;
  const ocrTexto=document.getElementById('ft-ocrRaw').textContent||'';

  const btn=document.getElementById('ft-guardarBtn');
  btn.disabled=true;
  btn.innerHTML=`<span class="spinner"></span> Guardando...`;
  ss('saving');
  try{
    let fotoUrl=null,fotoPath=null;
    if(st.fotoBlobPendiente){
      fotoPath=`${st.empresaId}/${fecha}/${Date.now()}_${slug(producto)}.jpg`;
      fotoUrl=await subirFoto(st.fotoBlobPendiente,fotoPath);
    }
    await ins('trazabilidad_fotos',{
      empresa_id:st.empresaId,fecha,producto,area:st.areaElegida||null,
      cantidad:cantidad?parseFloat(cantidad):null,unidad:unidad||null,
      foto_url:fotoUrl,foto_path:fotoPath,fecha_detectada:fechaDet,ocr_texto:ocrTexto||null
    });
    ss('online');
    await cargarFotosFecha(fecha);
    renderBotonesProducto();
    volverAGrid();
    document.getElementById('ft-ok').innerHTML=`<div class="alert alert-ok"><i class="ti ti-circle-check"></i> Guardado: ${esc(producto)}${cantidad?' — '+esc(cantidad)+(unidad?' '+esc(unidad):''):''}</div>`;
    document.getElementById('ft-manual-wrap').classList.add('hidden');
    st.fotoBlobPendiente=null;st.productoElegido=null;st.areaElegida=null;
  }catch(e){
    ss('error');
    alert('No se pudo guardar: '+e.message);
    btn.disabled=false;
    btn.innerHTML=`<i class="ti ti-device-floppy"></i> Guardar`;
  }
}

function slug(s){
  return(s||'prod').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40)||'prod';
}

// ---------- galería ----------
async function cargarGaleria(){
  const cont=document.getElementById('galeriaCont');
  if(!st.empresaId){cont.innerHTML='';return}
  cont.innerHTML='<div class="empty"><i class="ti ti-loader-2"></i>Cargando...</div>';
  const todas=document.getElementById('gl-todas').checked;
  const fecha=document.getElementById('gl-fecha').value;
  document.getElementById('gl-fecha').disabled=todas;
  let qs=`empresa_id=eq.${st.empresaId}&order=created_at.desc&limit=300`;
  if(!todas&&fecha)qs+=`&fecha=eq.${fecha}`;
  try{
    st.galeria=await get('trazabilidad_fotos',qs);
  }catch(e){st.galeria=[];cont.innerHTML=`<div class="alert alert-err"><i class="ti ti-alert-triangle"></i> No se pudo cargar: ${esc(e.message)}</div>`;return}
  renderGaleria();
}

function renderGaleria(){
  const cont=document.getElementById('galeriaCont');
  if(!st.galeria.length){
    cont.innerHTML=`<div class="empty"><i class="ti ti-photo-off"></i>No hay fotos cargadas con este filtro.</div>`;
    return;
  }
  cont.innerHTML=`<div class="gal-grid">`+st.galeria.map(f=>{
    const cant=f.cantidad!=null?`${Number(f.cantidad).toLocaleString('es-AR')}${f.unidad?' '+esc(f.unidad):''}`:'';
    const fecha=new Date(f.fecha+'T00:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    const fdet=f.fecha_detectada?new Date(f.fecha_detectada+'T00:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'';
    const thumb=f.foto_url?`<img class="gal-thumb" src="${f.foto_url}" onclick="abrirLightbox('${f.foto_url}')"/>`:`<div class="gal-thumb-empty"><i class="ti ti-photo-off"></i></div>`;
    return `<div class="gal-card">
      ${thumb}
      <button class="gal-del" onclick="borrarFotoGaleria('${f.id}')" title="Eliminar"><i class="ti ti-trash"></i></button>
      <div class="gal-body">
        <div class="gal-prod">${esc(f.producto)}</div>
        <div class="gal-sub">${cant?'Cantidad: '+esc(cant):'sin cantidad'}</div>
        <div class="gal-sub">${fecha}${fdet&&fdet!==fecha?' · foto: '+fdet:''}</div>
      </div>
    </div>`;
  }).join('')+`</div>`;
}

async function borrarFotoGaleria(id){
  const f=st.galeria.find(x=>x.id===id);
  if(!f)return;
  if(!confirm(`¿Eliminar la foto de "${f.producto}"?`))return;
  ss('saving');
  try{
    if(f.foto_path)await borrarFoto(f.foto_path);
    await del('trazabilidad_fotos',id);
    st.galeria=st.galeria.filter(x=>x.id!==id);
    renderGaleria();
    ss('online');
  }catch(e){ss('error');alert('No se pudo eliminar: '+e.message)}
}

function abrirLightbox(url){
  if(!url)return;
  document.getElementById('lightboxImg').src=url;
  document.getElementById('lightbox').classList.add('open');
}
function cerrarLightbox(){document.getElementById('lightbox').classList.remove('open')}

function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
